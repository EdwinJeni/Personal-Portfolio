<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin-left: 20%;
            
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
      
        .logo{
            font-size: medium;
            color: blue;
            position: absolute;
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
            transition: rgb(86, 62, 221) 0.3s;
            box-shadow: 0 4px 5px black;
            margin-right: 900px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 100px;
            margin-bottom: 20%;
        
        }
        .logo::first-line{
            color:rgb(235, 237, 235);
            font-weight: bold;
            text-shadow: 10px black;
            
        }
        .logo::first-letter{
            font-size: 150px;
            color: rgb(251, 244, 244);
            font-weight: bold;
            text-shadow: 4px 4px 7px black;
        }
        .logo::before{
            content:"";
            position: absolute;
            top: 10px;
            left: 10px;
            width:calc(100%-20%) ;
            height:calc(100%-20%);
            border: 2px none black;
            border-radius: 10px;
            pointer-events: fill;
            transition: border-color rgb(117, 105, 105) 0.3s;
        }
        .logo::after{
            content:"";
            position: absolute;
            top: 0%;
            left: 0%;
            width:100%;
            height:100%;
            border: 2px none black;
            border-radius: 10px;
            pointer-events: fill;
            transition: border-color rgb(143, 123, 123) 0.3s;
        }
        .logo:hover{
            color: blue;
            background-color:transparent;
        }
      
        .logo:hover::before{
            background-color: blue;
        }
        ::selection{
            background-color: yellow;
            color: black;
        }
        h2{
            font-size: 50px;   
            color: rgb(249, 249, 253);
            position: absolute;
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
            transition: rgb(86, 62, 221) 0.3s;
            box-shadow: 0 4px 5px black;
            margin-right: 900px;
            font-family: 'Times New Roman', Times, serif;
            margin-top: 10%;
        }
        h3{
            font-size: 25px;   
            color: rgb(239, 237, 239);
            position: absolute;
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
            transition: rgb(86, 62, 221) 0.3s;
            box-shadow: 0 4px 5px black;
            margin-right: 900px;
            font-family: 'Times New Roman', Times, serif;
            margin-top: 20%;
        }
    </style>
</head>
<body background="u1.jpg">
<h1 class="logo">Contact</h1>
    <h2>91+8264696415</h2>
    <h3>Email:jenishedwin96@gmail.com</h3>
   
    <div class="container">
        <h7>Contact Us</h7>
        <form id="contactForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message"  required></textarea>
            <button type="submit">Send Message</button>
        </form>
        <p id="responseMessage" style="color: green; display: none;">Message sent successfully!</p>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('responseMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('responseMessage').style.display = 'none';
                document.getElementById('contactForm').reset();
            }, 3000);
        });
    </script>
</body>
</html>
